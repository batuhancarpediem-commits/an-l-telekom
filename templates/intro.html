<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>{{css}}
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.center .logo-pill { width: 700px; height: 250px; margin-bottom: 70px; }
.center .bar { margin-left: auto; margin-right: auto; }
.center h1 { font-size: 112px; margin-bottom: 26px; }
.center p { font-size: 44px; opacity: .88; }
.company { position: absolute; bottom: 64px; width: 100%; text-align: center; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; opacity: .65; }
</style></head><body><div class="stage on-dark">
  <div class="center">
    <div class="logo-pill"><img src="{{footer_logo}}"></div>
    <div class="bar"></div>
    <h1>{{title}}</h1>
    <p class="lead">{{subtitle}}</p>
  </div>
  <div class="company">{{company}}</div>
</div></body></html>
